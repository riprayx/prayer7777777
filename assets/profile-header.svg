<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.45" stop-color="#102A63"/>
      <stop offset="1" stop-color="#3B176B"/>
    </linearGradient>
    <linearGradient id="accent" x1="140" y1="270" x2="1060" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.35 0 0 0 0 0.55 0 0 0 0 1 0 0 0 0.7 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <circle cx="175" cy="90" r="120" fill="#38BDF8" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="1010" cy="284" r="145" fill="#A78BFA" fill-opacity="0.20" filter="url(#glow)"/>
  <path d="M104 268C250 178 410 312 548 222C691 129 824 126 1078 84" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
  <path d="M104 290C260 205 395 330 562 248C706 177 844 154 1078 118" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.28"/>

  <g opacity="0.95">
